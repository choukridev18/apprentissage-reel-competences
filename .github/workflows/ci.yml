name: CI tests API

on:
  push:
    branches: [main]
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: installer les paquets
        run: pip install -r requirements.txt
      - name: Lancer pytest API
        run: pytest test_echo.py -q